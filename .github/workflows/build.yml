name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: Intel Macs (macos-26-intel is the last Intel image, macOS 26 being the last macOS for Intel Macs)
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Use Alire for the GNAT toolchain, and picking PJ_OS for the system it runs on
      - uses: alire-project/setup-alire@v6

      # cpuload_version() is a public C API, check for version mismatch with alire.toml
      - name: Check the version in alire.toml and in the library agree
        shell: bash
        run: |
          crate=$(grep -m1 '^version' alire.toml | cut -d'"' -f2)
          code=$(grep -A3 'function Version return String is' src/cpu_load.ads \
                 | grep -o '"[0-9][^"]*"' | tr -d '"')
          echo "alire.toml: $crate    src/cpu_load.ads: $code"
          if [ -z "$crate" ] || [ "$crate" != "$code" ]; then
            echo "::error::version mismatch between alire.toml and src/cpu_load.ads"
            exit 1
          fi

      - name: Build the static library
        run: alr --non-interactive build

      - name: Build the relocatable (shared) library
        run: alr exec -- gprbuild -P cpuload.gpr -XCPULOAD_LIBRARY_TYPE=relocatable -p

      - name: Build the Ada example
        run: alr exec -- gprbuild -P example/example.gpr -p

      - name: Build the C example (Linux and macOS)
        if: runner.os != 'Windows'
        run: alr exec -- make -C example/c

      - name: Build the C example (Windows)
        if: runner.os == 'Windows'
        run: |
          # make is not installed on the Windows runner, unlike gcc
          # The Makefile runs its commands in cmd, so the default PowerShell shell of the runner is fine
          choco install make --no-progress -y
          alr exec -- make -C example/c

      # Nothing to compile for Python: this builds the library it loads
      # make is on every runner by now: the Windows step above installed it
      - name: Build the library the Python example loads
        run: alr exec -- make -C example/python

      # Own object folder, so the objects of the library built above are not replaced
      - name: Compile-check the FreeBSD branch (Linux)
        if: runner.os == 'Linux'
        run: alr exec -- gprbuild -P cpuload.gpr -XPJ_OS=freebsd -f -c --subdirs=check-freebsd

      # The examples take a number of readings after the application name ("" follows none) and stop
      - name: Run the examples for a few readings
        shell: bash
        run: |
          ./example/example_cpu_load "" 3
          ./example/c/example_c "" 3
